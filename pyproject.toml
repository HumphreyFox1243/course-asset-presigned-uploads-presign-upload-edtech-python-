[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "course-asset-presigned-uploads"
version = "0.1.0"
description = "A typed Python service that signs direct browser uploads for course assets before learner deadlines."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/course_asset_upload"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

